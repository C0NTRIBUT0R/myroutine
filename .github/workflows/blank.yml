
name: Smart Android APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching repository..."

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          DIR=$(realpath "$DIR")

          if [ ! -f "$DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper missing!"
            exit 1
          fi

          chmod +x "$DIR/gradlew"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Project found: $DIR"

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find Generated APK
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build Diagnostics
        if: failure()
        run: |
          echo "Build failed."
          echo "Project directory: $PROJECT_DIR"
          java -version
          find . -name gradlew -o -name settings.gradle -o -name settings.gradle.kts
          
