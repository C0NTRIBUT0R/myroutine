
name: Smart Android APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android Project Automatically
        id: locate
        shell: bash
        run: |
          echo "Searching for Android project..."

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          WRAPPER="$DIR/gradlew"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper missing!"
            exit 1
          fi

          chmod +x "$WRAPPER"

          PROJECT_DIR="$GITHUB_WORKSPACE/${DIR#./}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project located: $PROJECT_DIR"

      - name: Build APK With Recovery Attempts
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"

            if ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace; then
              echo "BUILD SUCCESSFUL!"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Clearing project Gradle caches..."
              rm -rf .gradle
              sleep 5
            fi
          done

          echo "All build attempts failed."
          exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Show Build Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "BUILD FAILED - DIAGNOSTICS"

          echo "Project structure:"
          find "$GITHUB_WORKSPACE" -maxdepth 4 \
            -type f \( -name 'gradlew' \
            -o -name 'settings.gradle*' \
            -o -name 'build.gradle*' \)

          echo "Java version:"
          java -version

          echo "Gradle wrapper:"
          if [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/gradlew" ]; then
            cd "$PROJECT_DIR"
            ./gradlew --version
          fi
          
